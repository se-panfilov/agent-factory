# Managed by factory-setup S03.
# Keep this drop-in minimal and reversible.

PubkeyAuthentication yes
PasswordAuthentication no
KbdInteractiveAuthentication no
ChallengeResponseAuthentication no
PermitRootLogin no
PermitEmptyPasswords no
X11Forwarding no
AllowTcpForwarding no

# The explicit listen port is inventory-derived during S03 planning.
# Override manually only with owner-reviewed diff and renewed S03 gate.
Port 22
